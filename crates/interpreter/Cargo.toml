[package]
name = "revm-interpreter"
description = "Revm Interpreter that executes bytecode."
version = "29.0.1"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
# revm
bytecode.workspace = true
primitives.workspace = true
context-interface.workspace = true
state.workspace = true

# optional
serde = { workspace = true, features = ["derive", "rc"], optional = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["alloc"] }

# `required-features` rather than `#![cfg(feature = "serde")]` in the file: naming this target
# without the feature is then an error, instead of compiling zero of its ten tests and
# reporting success. A self dev-dependency fixes that too, but by turning `serde` on for every
# test build of this crate -- unification then denies the whole tree a serde-free build.
[[test]]
name = "shared_memory_serde"
required-features = ["serde"]

[features]
default = ["std"]
std = [
	"serde?/std",
	"primitives/std",
	"context-interface/std",
	"bytecode/std",
	"state/std",
	"serde_json/std",
]
hashbrown = ["primitives/hashbrown"]
serde = [
	"dep:serde",
	"primitives/serde",
	"bytecode/serde",
	"context-interface/serde",
	"state/serde",
]
arbitrary = ["std", "primitives/arbitrary"]
# TODO : Should be set from Context or from crate that consumes this PR.
memory_limit = []
