name: Tests

concurrency:
  cancel-in-progress: true
  group: ${{github.workflow}}-${{github.ref}}

# `pico-v98-31-0-2` is this fork's integration branch: every campaign PR targeted it, and
# with the trigger gated to `main` alone neither this workflow nor the EF statetest suite ran
# for any of PRs #2-#7. The guard was that the CI never ran, which is not a guard.
on:
  push:
    branches: [main, "release/**", "pico-v98-31-0-2"]
  pull_request:
    branches: [main, "release/**", "pico-v98-31-0-2"]

env:
  CARGO_TERM_COLOR: always
  # What this fork builds with in place of `--all-features`; see the note on the `test` matrix
  # below for why `--all-features` is not usable here. Every job that would otherwise have
  # reached for `--all-features` reads this one value, so `test`, `clippy` and `docs` cannot
  # drift apart again -- which is how `docs` was left running a command that cannot pass.
  #
  # `memory_limit` is in the set because it gates real code, including the two MLOAD/MSTORE
  # regression tests: with `--features serde` alone those are compiled out of every job, and
  # `cargo hack check` below does not compile test targets, so nothing would have run them.
  FORK_FEATURES: "serde,memory_limit"

jobs:
  test:
    name: test ${{ matrix.rust }} ${{ matrix.flags }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88", "stable", "nightly"]
        # `--all-features` is **not** buildable on this fork and has not been since before its
        # tip: `--all-features` selects `revm-precompile`'s `bn` backend, which does not
        # compile against the `substrate-bn` fork this tree pins (`cannot add AffineG1 to
        # AffineG1`). It is 3 errors at `pico-v98-31-0-2` with no commit of this branch
        # applied. Enabling this workflow's trigger without dropping that cell would give a
        # permanently red matrix entry, and a CI that is red for a reason nobody caused is a
        # CI nobody reads.
        #
        # The four cells in its place, and what each one is the only cover for:
        #   --no-default-features   the no_std-shaped surface
        #   ""                      the defaults, i.e. what a plain dependant gets
        #   --features serde        the INV-B serde suite and the `Interpreter` round trip --
        #                           and, being serde *without* `memory_limit`, the
        #                           configuration rsp actually ships
        #   $FORK_FEATURES          `memory_limit`, which gates `check_memory_limit` and the
        #                           two MLOAD/MSTORE `MemoryLimitOOG` regression tests
        #
        # None of these cells builds a *serde-free* `revm-interpreter`, including the
        # `--no-default-features` one: `crates/ee-tests` declares `revm = { features =
        # ["serde"] }` unconditionally, so a `--workspace` build unifies `serde` on for the
        # whole tree no matter what is passed here. That configuration is covered by the
        # `test-no-serde` job below, not by this matrix -- saying so here because assuming
        # otherwise is exactly the mistake that let the self dev-dependency in
        # `crates/interpreter/Cargo.toml` go unnoticed.
        flags:
          - "--no-default-features"
          - ""
          - "--features serde"
          - "--features serde,memory_limit"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace ${{ matrix.flags }}

  # The configuration `--workspace` cannot reach: the crates that matter, built without
  # `serde`, so a `#[cfg(not(feature = "serde"))]` path or a compile error that only appears
  # there is reachable from CI at all. Package-scoped on purpose -- adding any crate that
  # depends on `revm` with `serde` on defeats the point of the job.
  test-no-serde:
    name: test without serde
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test -p revm-interpreter -p revm-bytecode -p revm-primitives \
                     -p revm-context -p revm-context-interface -p revm-state

  check-no-std:
    name: check no_std ${{ matrix.target }} ${{ matrix.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ["riscv32imac-unknown-none-elf", "riscv64imac-unknown-none-elf"]
        features: [""]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: |
          cargo check --target ${{ matrix.target }} --no-default-features --features=${{ matrix.features }}
          cargo check --target ${{ matrix.target }} -p op-revm --no-default-features --features=${{ matrix.features }}
          cargo check --target ${{ matrix.target }} -p revm-database --no-default-features

  check:
    name: check ${{ matrix.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ["", "serde", "std", "std,map-foldhash"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --no-default-features -p revm --features=${{ matrix.features }}

  feature-checks:
    name: features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # `--exclude-features bn` for the same reason the `test` matrix drops `--all-features`:
      # the powerset selects `revm-precompile`'s `bn` backend on its own, which does not build
      # against the pinned `substrate-bn`. Excluding the one feature keeps every other
      # combination under test, which is the point of this job.
      - name: cargo hack
        run: cargo hack check --feature-powerset --depth 1 --exclude-features bn

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Not `--all-features`, for the reason given on the `test` matrix above. The
      # deny-by-default lints -- which are the ones that have caught real defects in this fork
      # (`derived_hash_with_manual_eq`, `arithmetic_overflow`) -- fire on the default feature
      # set just the same.
      - run: cargo clippy --workspace --all-targets --features ${{ env.FORK_FEATURES }}
        env:
          RUSTFLAGS: -Dwarnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs
      # Not `--all-features`: rustdoc type-checks, so it fails on the `bn` backend exactly as
      # `cargo check` does. This job was left on `--all-features` when `test` and `clippy`
      # moved off it, which would have made it permanently red the moment the branch trigger
      # above started firing.
      - run: cargo doc --workspace --features ${{ env.FORK_FEATURES }} --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  feature-propagation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: run zepter
        run: |
          cargo install zepter -f --locked
          zepter --version
          time zepter run check

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@v1
