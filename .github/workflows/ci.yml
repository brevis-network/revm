name: Tests

concurrency:
  cancel-in-progress: true
  group: ${{github.workflow}}-${{github.ref}}

# `pico-v98-31-0-2` is this fork's integration branch; PRs target it, not `main`.
on:
  push:
    branches: [main, "release/**", "pico-v98-31-0-2"]
  pull_request:
    branches: [main, "release/**", "pico-v98-31-0-2"]

env:
  CARGO_TERM_COLOR: always
  # Stands in for `--all-features`, which does not build here (see the `test` matrix).
  # `clippy` and `docs` read it so they cannot drift from `test`.
  FORK_FEATURES: "serde,memory_limit"

jobs:
  test:
    name: test ${{ matrix.rust }} ${{ matrix.flags }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88", "stable", "nightly"]
        # Not `--all-features`: it selects `revm-precompile`'s `bn` backend, which does not
        # build against the pinned `substrate-bn` (`cannot add AffineG1 to AffineG1`).
        #
        # `--features serde` is serde *without* `memory_limit`, which is what rsp ships; the
        # last cell is the only one that compiles the MLOAD/MSTORE `MemoryLimitOOG` tests.
        #
        # None of them builds a serde-free `revm-interpreter`, not even the first:
        # `crates/ee-tests` depends on `revm` with `serde` on, and unification is
        # workspace-wide. See `test-no-serde`.
        flags:
          - "--no-default-features"
          - ""
          - "--features serde"
          - "--features serde,memory_limit"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace ${{ matrix.flags }}

  # Package-scoped on purpose: adding any crate that depends on `revm` with `serde` on
  # turns the feature back on through unification and silently defeats this job.
  test-no-serde:
    name: test without serde
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test -p revm-interpreter -p revm-bytecode -p revm-primitives \
                     -p revm-context -p revm-context-interface -p revm-state

  check-no-std:
    name: check no_std ${{ matrix.target }} ${{ matrix.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ["riscv32imac-unknown-none-elf", "riscv64imac-unknown-none-elf"]
        features: [""]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: |
          cargo check --target ${{ matrix.target }} --no-default-features --features=${{ matrix.features }}
          cargo check --target ${{ matrix.target }} -p op-revm --no-default-features --features=${{ matrix.features }}
          cargo check --target ${{ matrix.target }} -p revm-database --no-default-features

  check:
    name: check ${{ matrix.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ["", "serde", "std", "std,map-foldhash"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --no-default-features -p revm --features=${{ matrix.features }}

  feature-checks:
    name: features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # `bn` for the same reason the `test` matrix drops `--all-features`.
      - name: cargo hack
        run: cargo hack check --feature-powerset --depth 1 --exclude-features bn

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --features ${{ env.FORK_FEATURES }}
        env:
          RUSTFLAGS: -Dwarnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs
      # Not `--all-features`: rustdoc type-checks, so it fails on the `bn` backend too.
      - run: cargo doc --workspace --features ${{ env.FORK_FEATURES }} --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  feature-propagation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: run zepter
        run: |
          cargo install zepter -f --locked
          zepter --version
          time zepter run check

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@v1
