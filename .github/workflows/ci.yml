name: Tests

concurrency:
  cancel-in-progress: true
  group: ${{github.workflow}}-${{github.ref}}

# `pico-v98-31-0-2` is this fork's integration branch: every campaign PR targeted it, and
# with the trigger gated to `main` alone neither this workflow nor the EF statetest suite ran
# for any of PRs #2-#7. The guard was that the CI never ran, which is not a guard.
on:
  push:
    branches: [main, "release/**", "pico-v98-31-0-2"]
  pull_request:
    branches: [main, "release/**", "pico-v98-31-0-2"]

env:
  CARGO_TERM_COLOR: always
  # What this fork builds with in place of `--all-features` (see the `test` matrix below).
  # Read by `clippy` and `docs` so the three cannot drift apart again. `memory_limit` is in
  # the set because it gates the MLOAD/MSTORE regression tests.
  FORK_FEATURES: "serde,memory_limit"

jobs:
  test:
    name: test ${{ matrix.rust }} ${{ matrix.flags }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88", "stable", "nightly"]
        # Not `--all-features`: it selects `revm-precompile`'s `bn` backend, which does not
        # compile against the `substrate-bn` this tree pins (`cannot add AffineG1 to
        # AffineG1`), so the cell would be permanently red.
        #
        # What each cell is the only cover for:
        #   --no-default-features   the no_std-shaped surface
        #   ""                      the defaults a plain dependant gets
        #   --features serde        the INV-B serde suite, and serde *without* `memory_limit`,
        #                           which is what rsp ships
        #   $FORK_FEATURES          the MLOAD/MSTORE `MemoryLimitOOG` regression tests
        #
        # No cell here builds a serde-free `revm-interpreter`, not even the first:
        # `crates/ee-tests` depends on `revm` with `serde` on unconditionally, and
        # unification is workspace-wide. That is what `test-no-serde` below covers.
        flags:
          - "--no-default-features"
          - ""
          - "--features serde"
          - "--features serde,memory_limit"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace ${{ matrix.flags }}

  # The configuration `--workspace` cannot reach, so a `#[cfg(not(feature = "serde"))]` path
  # is exercised somewhere. Package-scoped on purpose: adding any crate that depends on
  # `revm` with `serde` on defeats the job.
  test-no-serde:
    name: test without serde
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test -p revm-interpreter -p revm-bytecode -p revm-primitives \
                     -p revm-context -p revm-context-interface -p revm-state

  check-no-std:
    name: check no_std ${{ matrix.target }} ${{ matrix.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ["riscv32imac-unknown-none-elf", "riscv64imac-unknown-none-elf"]
        features: [""]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: |
          cargo check --target ${{ matrix.target }} --no-default-features --features=${{ matrix.features }}
          cargo check --target ${{ matrix.target }} -p op-revm --no-default-features --features=${{ matrix.features }}
          cargo check --target ${{ matrix.target }} -p revm-database --no-default-features

  check:
    name: check ${{ matrix.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ["", "serde", "std", "std,map-foldhash"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --no-default-features -p revm --features=${{ matrix.features }}

  feature-checks:
    name: features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # `bn` for the same reason the `test` matrix drops `--all-features`; every other
      # combination stays under test.
      - name: cargo hack
        run: cargo hack check --feature-powerset --depth 1 --exclude-features bn

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Not `--all-features`, for the reason given on the `test` matrix above. The
      # deny-by-default lints -- which are the ones that have caught real defects in this fork
      # (`derived_hash_with_manual_eq`, `arithmetic_overflow`) -- fire on the default feature
      # set just the same.
      - run: cargo clippy --workspace --all-targets --features ${{ env.FORK_FEATURES }}
        env:
          RUSTFLAGS: -Dwarnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs
      # Not `--all-features`: rustdoc type-checks, so it fails on the `bn` backend too.
      - run: cargo doc --workspace --features ${{ env.FORK_FEATURES }} --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  feature-propagation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: run zepter
        run: |
          cargo install zepter -f --locked
          zepter --version
          time zepter run check

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@v1
