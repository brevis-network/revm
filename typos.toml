[default]
# `[0-9a-f]{7,40}` exempts git SHAs quoted in comments: several notes in this tree cite the
# commit a claim came from, and the dictionary reads the hex as misspelled words (`de7caf9c`
# -> `caf` -> `calf`).
extend-ignore-identifiers-re = ["[sS]imular", "ba", "\\b[0-9a-f]{7,40}\\b"]

[files]
extend-exclude = ["CHANGELOG.md", "tests"]
